name: Osvježi raspored

on:
  schedule:
    # Ponedjeljak i srijeda u 05:00 UTC (07:00 po zagrebačkom ljetnom vremenu).
    - cron: "0 5 * * 1,3"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "docs/style.css"
      - ".github/workflows/update-calendar.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Izgradi kalendar i stranicu
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          export SITE_BASE_URL="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}"
          echo "Bazni URL: $SITE_BASE_URL"
          python scripts/build.py

      - name: Spremi promjene
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Nema promjena u rasporedu."
          else
            git commit -m "Automatsko osvježavanje rasporeda ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
